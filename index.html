<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA BANK - لوحة إدارة الحزم وتوليد الرخص</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #111; margin-bottom: 25px; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; transition: border 0.3s; }
        select:focus, input:focus { border-color: #007bff; }
        button { width: 100%; background: #007bff; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #0056b3; }
        .result-box { margin-top: 25px; padding: 20px; background: #e9ecef; border-radius: 8px; display: none; text-align: center; }
        .result-box h3 { color: #28a745; margin-bottom: 10px; }
        .key-display { font-size: 20px; font-weight: bold; background: #fff; padding: 10px; border: 1px dashed #ccc; border-radius: 6px; display: inline-block; margin-top: 10px; color: #333; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏦 EVA BANK - إدارة الاشتراكات</h1>
    
    <div class="form-group">
        <label for="projectSelect">اختر المشروع المستهدف:</label>
        <select id="projectSelect">
            <option value="catalog">قالب الكتالوج الذكي (Catalog)</option>
            <option value="miss_eva">المعلمة إيفا (Miss Eva)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="phoneInput">رقم هاتف المشترك:</label>
        <input type="text" id="phoneInput" placeholder="مثال: 970594101632">
    </div>

    <div class="form-group">
        <label for="packageSelect">اختر مدة الحزمة (الصلاحية):</label>
        <select id="packageSelect">
            <option value="30">شهر واحد (30 يوم)</option>
            <option value="90">3 شهور (90 يوم)</option>
            <option value="365">سنة كاملة (365 يوم)</option>
            <option value="1">تجريبي (سريع - يوم واحد)</option>
        </select>
    </div>

    <button onclick="generateKey()">توليد وتفعيل رمز الاشتراك</button>

    <div id="resultBox" class="result-box">
        <h3>تم توليد الرمز بنجاح!</h3>
        <p>رمز التفعيل الخاص بالزبون:</p>
        <div class="key-display" id="generatedKeyText"></div>
    </div>
</div>

<!-- ربط Firebase SDK ومحرك التوليد -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // مفاتيح الربط الخاصة بمشروع EVA BANK الجديد
    const firebaseConfig = {
        apiKey: "AIzaSyCW-Kqz4jQbu-wUg-LOVPJdWv7p3jIOB6o",
        authDomain: "eva-bank-a077d.firebaseapp.com",
        projectId: "eva-bank-a077d",
        storageBucket: "eva-bank-a077d.firebasestorage.app",
        messagingSenderId: "264483948353",
        appId: "1:264483948353:web:4472d6ee97b432a351b800"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.generateKey = async function() {
        const project = document.getElementById('projectSelect').value;
        const phone = document.getElementById('phoneInput').value.trim();
        const days = parseInt(document.getElementById('packageSelect').value);

        if (!phone) {
            alert('يرجى إدخال رقم هاتف المشترك!');
            return;
        }

        const randomStr = Math.random().toString(36).substring(2, 8).toUpperCase();
        const keyCode = `EVA-${project.toUpperCase()}-${randomStr}`;

        const startDate = new Date();
        const expireDate = new Date();
        expireDate.setDate(startDate.getDate() + days);

        try {
            await addDoc(collection(db, "licenses"), {
                key_code: keyCode,
                project_id: project,
                phone: phone,
                duration_days: days,
                start_date: startDate.toISOString(),
                expire_date: expireDate.toISOString(),
                status: "active"
            });

            document.getElementById('generatedKeyText').innerText = keyCode;
            document.getElementById('resultBox').style.display = 'block';
            alert('تم حفظ وتفعيل الرمز في بنك الحزم بنجاح!');
        } catch (e) {
            console.error("Error adding document: ", e);
            alert('حدث خطأ أثناء حفظ الرمز، يرجى المحاولة لاحقاً.');
        }
    };
</script>

</body>
</html>
